name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, zip
          tools: composer:v2
          coverage: pcov
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
